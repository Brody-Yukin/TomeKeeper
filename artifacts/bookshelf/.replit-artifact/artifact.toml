kind = "mobile"
previewPath = "/"
title = "TomeKeeper"
version = "1.0.0"
id = "artifacts/bookshelf"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25218

[services.development]
run = "pnpm --filter @workspace/bookshelf run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookshelf", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bookshelf", "run", "serve" ]

[services.env]
PORT = "25218"
BASE_PATH = "/"
