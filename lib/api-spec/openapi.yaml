openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: books
    description: Book identification operations
  - name: library
    description: Per-user book library operations (require authentication)
paths:
  /library:
    get:
      operationId: listLibraryBooks
      tags: [library]
      summary: List the signed-in user's library
      responses:
        "200":
          description: The user's library books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryBook"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addLibraryBook
      tags: [library]
      summary: Add (or upsert) a book to the signed-in user's library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryBook"
      responses:
        "200":
          description: The stored book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBook"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /library/import:
    post:
      operationId: importLibraryBooks
      tags: [library]
      summary: Bulk-import books into the signed-in user's library
      description: Upserts each book, used to migrate an on-device library to the account on first sync. Returns the full library after import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportLibraryRequest"
      responses:
        "200":
          description: The full library after import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryBook"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /library/{id}:
    patch:
      operationId: updateLibraryBook
      tags: [library]
      summary: Update fields on a book in the signed-in user's library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryBookUpdate"
      responses:
        "200":
          description: The updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBook"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found in this user's library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeLibraryBook
      tags: [library]
      summary: Remove a book from the signed-in user's library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed (or was not present)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /books/identify-cover:
    post:
      operationId: identifyBookCover
      tags: [books]
      summary: Identify a book from a cover photo
      description: Accepts a base64-encoded cover photo and returns structured cover analysis extracted with server-side image recognition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyCoverRequest"
      responses:
        "200":
          description: Cover analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverAnalysis"
        "400":
          description: Invalid request (bad MIME type or image too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /books/isbn/{isbn}:
    get:
      operationId: getBookByIsbn
      tags: [books]
      summary: Look up a book by ISBN
      description: Validates and normalizes an ISBN-10 or ISBN-13, then queries the Google Books catalog server-side.
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
          description: ISBN-10 or ISBN-13 (hyphens/spaces allowed)
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetails"
        "400":
          description: Invalid ISBN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog responded successfully but has no book for this ISBN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Catalog service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    IdentifyCoverRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image bytes (no data URL prefix)
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required:
        - imageBase64
        - mimeType
    CoverAnalysis:
      type: object
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        editionText:
          type: string
        possibleIsbn:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
        - title
        - authors
        - publisher
        - editionText
        - possibleIsbn
        - confidence
    BookDetails:
      type: object
      properties:
        isbn:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: string
        pageCount:
          type: number
        coverUrl:
          type: string
        publisher:
          type: string
        publishedDate:
          type: string
        categories:
          type: array
          items:
            type: string
        language:
          type: string
      required:
        - isbn
        - title
        - authors
        - description
        - pageCount
        - coverUrl
        - publisher
        - publishedDate
        - categories
        - language
    LibraryBook:
      type: object
      properties:
        id:
          type: string
        isbn:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        description:
          type: string
        pageCount:
          type: number
        currentPage:
          type: number
        coverUrl:
          type: string
        publisher:
          type: string
        publishedDate:
          type: string
        categories:
          type: array
          items:
            type: string
        language:
          type: string
        status:
          type: string
          enum: [unread, reading, read]
        dateAdded:
          type: number
          description: Epoch milliseconds
        dateFinished:
          type: number
          description: Epoch milliseconds
        rating:
          type: number
      required:
        - id
        - isbn
        - title
        - authors
        - description
        - pageCount
        - currentPage
        - coverUrl
        - publisher
        - publishedDate
        - categories
        - language
        - status
        - dateAdded
    ImportLibraryRequest:
      type: object
      properties:
        books:
          type: array
          items:
            $ref: "#/components/schemas/LibraryBook"
      required: [books]
    LibraryBookUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [unread, reading, read]
        currentPage:
          type: number
        rating:
          type: number
        dateFinished:
          type: number
          description: Epoch milliseconds
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

